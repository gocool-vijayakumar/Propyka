name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: API build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build solution
        run: dotnet build backend/Propyka/Propyka.sln --configuration Release

  frontend:
    name: Web app build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/propyka-web
    steps:
      - uses: actions/checkout@v4

      # Angular 22 requires Node 22.22.3+ or 24.15+. '24' resolves to a supported release.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/propyka-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npx ng build --configuration production

      - name: Unit tests
        run: npx ng test --watch=false
