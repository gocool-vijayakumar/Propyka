<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Propyka — Property, marketplace and trades in one account</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edeff2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0e14" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Type: Bricolage Grotesque (display) / Instrument Sans (UI) / IBM Plex Mono (annotations) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!--
    Theme bootstrap. Runs before first paint so the page never flashes
    the wrong theme. Keep the storage key in sync with Theme service.
  -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('propyka-theme');
        var theme = stored ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>

<body>
  <app-root></app-root>
</body>
</html>
